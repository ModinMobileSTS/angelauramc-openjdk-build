name: Build OpenJDK 8 Android AArch64 explicit null checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_android_aarch64:
    name: Build Android aarch64
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: zulu

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev gcc-multilib g++-multilib libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev

      - name: Build with CI build script
        run: bash ci_build_arch_aarch64.sh

      - name: Verify explicit null-check default
        run: |
          grep -F 'define_pd_global(bool, ImplicitNullChecks,       false)' \
            openjdk/hotspot/src/cpu/aarch64/vm/globals_aarch64.hpp

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: jdk8-android-aarch64-explicit-null-checks
          path: jdk8-android*.tar.xz

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: jre8-android-aarch64-explicit-null-checks
          path: jre8-android*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: jre8-android-aarch64-explicit-null-checks-debuginfo
          path: dizout
